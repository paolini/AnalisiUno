\Preamble{xhtml,mathjax}
% foglio di stile e viewport
\Configure{AddCss}{style.css}
\Configure{@HEAD}{\HCode{<meta name="viewport" content="width=device-width, initial-scale=1" />\Hnewline}}
% MathJax: carichiamo noi lo script, dopo mathjax-config.js
% (generato da mathjax_macros.py) che definisce le macro
\Configure{MathjaxSource}{}
\Configure{@HEAD}{\HCode{<script src="mathjax-config.js"></script>\Hnewline
<script async="async" id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml-full.js"></script>\Hnewline}}

% navigazione tra le pagine, in italiano
\Configure{crosslinks}{}{}{successivo →}{← precedente}{}{}{}{↑ indice}
\Configure{crosslinks*}{prev}{up}{next}{}

% note a margine: <span> perche' stanno dentro i paragrafi.
% Dentro la nota le formule display usano <span> invece di <div>
% e le righe vuote diventano a capo, per non chiudere il <p> circostante.
\renewcommand\marginnote[2][]{%
  \ifvmode\leavevmode\fi
  \HCode{<span class="marginnote">}%
  \begingroup
    \Configure{MathjaxBlock}{\HCode{<span class="mathjax-block">}}{\HCode{</span>}}%
    \Configure{MathjaxEnv}{\HCode{<span class="mathjax-env">}}{\HCode{</span>}}%
    \def\par{\HCode{<br />}}%
    #2%
  \endgroup
  \HCode{</span>}}
% Equazioni numerate: i numeri li calcola TeX (uno per riga negli align)
% e li passiamo a MathJax con \tag, cosi' coincidono con i riferimenti
% (MathJax ha tags: 'none'). Le righe con \nonumber o \notag restano
% senza numero; le \label vengono tolte dal codice passato a MathJax.
\ExplSyntaxOn
\seq_new:N \l__au_rows_seq
\seq_new:N \l__au_out_seq
\tl_new:N \l__au_acc_tl
\tl_new:N \l__au_out_tl
\int_new:N \l__au_depth_int
% #1: corpo dell'ambiente, #2: ambiente da passare a MathJax
\cs_new_protected:Npn \__au_numbered:nn #1#2
 {
  \seq_set_split_keep_spaces:Nnn \l__au_rows_seq { \\ } {#1}
  \seq_clear:N \l__au_out_seq
  \tl_clear:N \l__au_acc_tl
  \int_zero:N \l__au_depth_int
  \seq_map_inline:Nn \l__au_rows_seq
   {
    \int_compare:nNnTF \l__au_depth_int = 0
     { \tl_set:Nn \l__au_acc_tl {##1} }
     { \tl_put_right:Nn \l__au_acc_tl { \\ ##1 } }
    % i \\ dentro ambienti annidati (cases, aligned...) non separano righe
    \regex_count:nnN { \c{begin} } {##1} \l_tmpa_int
    \int_add:Nn \l__au_depth_int { \l_tmpa_int }
    \regex_count:nnN { \c{end} } {##1} \l_tmpa_int
    \int_sub:Nn \l__au_depth_int { \l_tmpa_int }
    \int_compare:nNnT \l__au_depth_int = 0 { \__au_row: }
   }
  \int_compare:nNnF \l__au_depth_int = 0 { \__au_row: }
  \tl_set:Ne \l__au_out_tl { \seq_use:Nn \l__au_out_seq { \\ } }
  \NoFonts
  \exp_args:NV \VerbMathToks \l__au_out_tl {#2}
  \EndNoFonts
 }
\cs_new_protected:Npn \__au_row:
 {
  \seq_clear:N \l_tmpa_seq
  \regex_extract_once:nVN { \c{label} \cB. (.*?) \cE. } \l__au_acc_tl \l_tmpa_seq
  \regex_replace_all:nnN { \c{label} \cB. .*? \cE. } {} \l__au_acc_tl
  \bool_set_true:N \l_tmpa_bool
  \tl_if_blank:VT \l__au_acc_tl { \bool_set_false:N \l_tmpa_bool }
  \regex_match:nVT { \c{nonumber} | \c{notag} } \l__au_acc_tl
    { \bool_set_false:N \l_tmpa_bool }
  \bool_if:NT \l_tmpa_bool
    {
     \refstepcounter{equation}
     \tl_put_right:Nx \l__au_acc_tl { ~ \exp_not:N \tag { \theequation } }
    }
  \seq_if_empty:NF \l_tmpa_seq { \exp_args:Ne \label { \seq_item:Nn \l_tmpa_seq {2} } }
  \seq_put_right:NV \l__au_out_seq \l__au_acc_tl
  \tl_clear:N \l__au_acc_tl
 }
\AtBeginDocument{
  \RenewDocumentEnvironment{equation}{+b}{ \__au_numbered:nn {#1} {equation*} }{}
  \RenewDocumentEnvironment{align}{+b}{ \__au_numbered:nn {#1} {align*} }{}
  \RenewDocumentEnvironment{gather}{+b}{ \__au_numbered:nn {#1} {gather*} }{}
}
\ExplSyntaxOff

% \stackrel non e' robusto con tex4ht: si rompe nelle didascalie (.aux)
\DeclareRobustCommand\stackrel[2]{\mathrel{\mathop{#2}\limits^{#1}}}

% figure in PDF: convertite in SVG dal Makefile (pdftocairo)
\Configure{graphics*}{pdf}{%
  \Picture[figura]{\csname Gin@base\endcsname.svg}%
  \special{t4ht+@File: \csname Gin@base\endcsname.svg}}

% QR code: in HTML diventano link con la descrizione.
% \mydoclink serve solo per l'indice dei link in docs/: qui non fa nulla
\renewcommand\mydoclink[2]{}
\renewcommand\myqr[2]{\href{#1}{#2}}
\renewcommand\myqrdoclink[3]{\href{#1}{\HCode{<span class="extlink"></span>}#3}}
\renewcommand\myqrshortdoclink[2]{\href{\myshorturl{#1}}{\HCode{<span class="extlink"></span>}#2}}
\renewcommand\myurlhere[2]{\href{\myshorturl{#1}}{\HCode{<span class="extlink"></span>}#2}}
\renewcommand\myshortqrcode[3]{\marginnote{\href{\myshorturl{#1}}{\HCode{<span class="extlink"></span>}#3}}}

% Nomi dei file HTML, presi dai file sorgente (tex4ht li mette tutti in
% una cartella; postprocess.py li sposta poi in una cartella per capitolo):
%   capitolo chapters/02_limiti.tex                 -> 02_limiti.html
%   sezione  chapters/02_limiti/06_radianti.tex     -> 02_limiti--06_radianti.html
%   sezione nello stesso file del capitolo (o di
%   un'altra sezione), es. le appendici             -> 99_appendix--@3.html
%     (postprocess.py usa poi il titolo della sezione)
%   bibliografia (.bbl) e indice analitico (.ind)   -> bibliografia.html, ...
\ExplSyntaxOn
\tl_new:N \g__au_chap_tl
\tl_new:N \g__au_lastfile_tl
\tl_new:N \l__au_file_tl
\tl_new:N \l__au_name_tl
\int_new:N \g__au_sec_int
\cs_new_protected:Npn \__au_cutname:n #1
 {
  \file_parse_full_name:VNNN \CurrentFile \l_tmpa_tl \l__au_name_tl \l_tmpb_tl
  \tl_set:Ne \l__au_file_tl { \CurrentFilePath / \CurrentFile }
  \str_case:nnF {#1}
   {
    {chapter} { \__au_chapname: }
    {likechapter} { \__au_chapname: }
    {appendix} { \__au_chapname: }
   }
   { \__au_secname: }
  \tl_gset_eq:NN \g__au_lastfile_tl \l__au_file_tl
  \exp_args:Ne \NextFile { \l__au_name_tl .html }
 }
\cs_new_protected:Npn \__au_chapname:
 {
  \str_case:VnT \l_tmpb_tl
   {
    {.bbl} { \tl_set:Nn \l__au_name_tl {bibliografia} }
    {.ind} { \tl_set:Nn \l__au_name_tl {indice-analitico} }
   }
   {}
  \tl_gset_eq:NN \g__au_chap_tl \l__au_name_tl
  \int_gzero:N \g__au_sec_int
 }
\cs_new_protected:Npn \__au_secname:
 {
  \int_gincr:N \g__au_sec_int
  \tl_if_eq:NNTF \l__au_file_tl \g__au_lastfile_tl
   { \tl_set:Ne \l__au_name_tl { \g__au_chap_tl --@ \int_use:N \g__au_sec_int } }
   { \tl_set:Ne \l__au_name_tl { \g__au_chap_tl -- \l__au_name_tl } }
 }
\cs_generate_variant:Nn \file_parse_full_name:nNNN { VNNN }
\cs_generate_variant:Nn \str_case:nnT { VnT }
\Configure{CutAt-filename}{\__au_cutname:n {#1}}
\ExplSyntaxOff

\renewcommand\mynote[1]{\marginnote{#1}}
\renewcommand\mymargin[1]{\marginnote{#1}}

\begin{document}
\EndPreamble

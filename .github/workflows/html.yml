name: versione HTML su GitHub Pages
# Compila la versione HTML (make html) e la pubblica su
# https://paolini.github.io/AnalisiUno/ (pagina iniziale, libro, rimandi dei QR code).
# Richiede: Settings > Pages > Source = "GitHub Actions".
on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]'  # rilascio IT: es. 2026-11-13
  workflow_dispatch:  # lancio a mano dalla pagina Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/xu-cheng/texlive-full:latest  # Alpine, come per i PDF
    steps:
      - uses: actions/checkout@v7
      - name: dipendenze (node per KaTeX, pdftocairo per le figure)
        run: apk add --no-cache nodejs npm poppler-utils
      - name: make html
        run: make html
      - name: assembla il sito
        run: |
          cp -r html/out _site
          # il libro e' stato per poco in online/: rimanda alla radice
          mkdir _site/online
          echo '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=../">' > _site/online/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
